<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Character IP Pipeline</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f0f14;color:#e0e0e0;min-height:100vh}
.container{max-width:1200px;margin:0 auto;padding:24px}
h1{font-size:28px;background:linear-gradient(135deg,#f0a500,#e04040,#a020f0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.subtitle{color:#888;font-size:14px;margin-bottom:32px}
.input-section{background:#1a1a24;border-radius:12px;padding:24px;margin-bottom:24px}
.input-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.input-row label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#aaa;flex:1;min-width:180px}
.input-row input,.input-row select{padding:10px 12px;border:1px solid #333;border-radius:8px;background:#0f0f14;color:#e0e0e0;font-size:14px}
.input-row input:focus{outline:none;border-color:#f0a500}
.stages{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.stage-chip{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;background:#252530;border:1px solid #333;transition:all .2s}
.stage-chip.selected{background:rgba(240,165,0,.2);border-color:#f0a500;color:#f0a500}
.btn{padding:12px 32px;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#f0a500,#e04040);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(240,165,0,.3)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.progress-section{background:#1a1a24;border-radius:12px;padding:24px;margin-bottom:24px;display:none}
.progress-bar{height:6px;background:#252530;border-radius:3px;overflow:hidden;margin:12px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,#f0a500,#e04040,#a020f0);border-radius:3px;transition:width .5s;width:0%}
.stage-dot{width:8px;height:8px;border-radius:50%;background:#333}
.stage-dot.done{background:#4caf50}
.stage-dot.running{background:#f0a500;animation:pulse 1s infinite}
.stage-dot.failed{background:#e04040}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.results-section{display:none;flex-direction:column;gap:24px}
.result-card{background:#1a1a24;border-radius:12px;overflow:hidden}
.result-header{padding:16px 24px;border-bottom:1px solid #252530;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.result-header h3{font-size:16px}
.result-body{padding:24px;max-height:500px;overflow-y:auto;display:none}
.result-body.open{display:block}
.story-text{line-height:1.8;font-size:15px;color:#ccc}
.lyrics-line{font-size:15px;color:#ccc;line-height:1.8}
.lyrics-section{margin-bottom:16px;padding:8px 0;border-bottom:1px solid #252530}
.lyrics-label{font-size:12px;color:#f0a500;margin-bottom:4px}
.storyboard-table{width:100%;border-collapse:collapse;font-size:13px}
.storyboard-table th{background:#252530;padding:8px 12px;text-align:left;color:#aaa}
.storyboard-table td{padding:8px 12px;border-bottom:1px solid #252530;vertical-align:top}
pre{background:#0f0f14;border-radius:8px;padding:16px;overflow-x:auto;font-size:13px;white-space:pre-wrap;word-break:break-all}
.toast{position:fixed;top:20px;right:20px;padding:12px 24px;border-radius:8px;font-size:14px;z-index:1000;animation:slideIn .3s}
.toast.error{background:#e04040;color:#fff}
.toast.success{background:#4caf50;color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>
</head>
<body>
<div class="container">
  <h1>Character IP Pipeline</h1>
  <p class="subtitle">角色IP全链路内容产线 - 从角色研究到MV成片</p>

  <div class="input-section">
    <div class="input-row">
      <label>角色名称*
        <input type="text" id="characterName" placeholder="例如：孙悟空" value="孙悟空">
      </label>
      <label>来源
        <input type="text" id="source" placeholder="例如：西游记原著" value="西游记原著">
      </label>
      <label>视觉风格
        <select id="style">
          <option value="auto">自动选择</option>
          <option value="realistic">写实国风</option>
          <option value="ink">水墨意境</option>
          <option value="cyberpunk">赛博国潮</option>
          <option value="dark">暗黑史诗</option>
        </select>
      </label>
      <label>模型
        <select id="model">
          <option value="deepseek-chat">DeepSeek</option>
          <option value="claude-sonnet-4-6">Claude Sonnet</option>
          <option value="gpt-4o">GPT-4o</option>
        </select>
      </label>
    </div>
    <div class="input-row">
      <label>API Key
        <input type="password" id="apiKey" placeholder="自动从环境变量读取">
      </label>
      <label>Base URL
        <input type="text" id="baseUrl" placeholder="https://api.deepseek.com" value="https://api.deepseek.com">
      </label>
    </div>

    <p style="font-size:13px;color:#aaa;margin:16px 0 8px">选择需要执行的阶段：</p>
    <div class="stages" id="stageSelector"></div>

    <button class="btn btn-primary" id="runBtn" onclick="runPipeline()">启动管线</button>
  </div>

  <div class="progress-section" id="progressSection">
    <p id="statusMessage" style="font-size:13px;color:#aaa;margin-bottom:8px"></p>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p id="progressText" style="font-size:13px;color:#aaa;margin-top:8px"></p>
  </div>

  <div class="results-section" id="resultsSection"></div>
</div>

<div id="toastContainer"></div>

<script>
'use strict';

const STAGE_NAMES = {
  research: '角色研究', angle: '选题策划', lyrics: '歌词生成',
  voice: '音色设计', song: '歌曲制作', visual: '形象设计', video: '视频制作'
};
const STAGE_EMOJI = {
  research: '🔍', angle: '💡', lyrics: '🎤',
  voice: '🎵', song: '🎧', visual: '🎨', video: '🎬'
};

let taskId = null;
let selectedStages = ['research','angle','lyrics','voice','song','visual','video'];

// Build stage chips
function buildStageChips() {
  const container = document.getElementById('stageSelector');
  container.textContent = '';
  Object.entries(STAGE_NAMES).forEach(function(entry) {
    var stage = entry[0];
    var name = entry[1];
    var chip = document.createElement('div');
    chip.className = 'stage-chip selected';
    chip.textContent = STAGE_EMOJI[stage] + ' ' + name;
    chip.dataset.stage = stage;
    chip.addEventListener('click', function() {
      this.classList.toggle('selected');
      selectedStages = Array.from(document.querySelectorAll('.stage-chip.selected')).map(function(c) { return c.dataset.stage; });
    });
    container.appendChild(chip);
  });
}

function showToast(msg, type) {
  var toast = document.createElement('div');
  toast.className = 'toast ' + (type || 'error');
  toast.textContent = msg;
  document.getElementById('toastContainer').appendChild(toast);
  setTimeout(function() { toast.remove(); }, 3000);
}

function escapeHTML(str) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

async function runPipeline() {
  var name = document.getElementById('characterName').value.trim();
  if (!name) { showToast('请输入角色名称', 'error'); return; }

  document.getElementById('runBtn').disabled = true;
  document.getElementById('progressSection').style.display = 'block';
  document.getElementById('resultsSection').style.display = 'none';
  document.getElementById('resultsSection').textContent = '';

  var resp = await fetch('/api/run', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      character_name: name,
      source: document.getElementById('source').value,
      style: document.getElementById('style').value,
      model: document.getElementById('model').value,
      api_key: document.getElementById('apiKey').value,
      base_url: document.getElementById('baseUrl').value,
      stages: selectedStages,
    }),
  });

  var data = await resp.json();
  taskId = data.task_id;
  pollStatus();
}

async function pollStatus() {
  var resp = await fetch('/api/status/' + taskId);
  var status = await resp.json();

  var pct = Math.round(status.progress * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = pct + '% - ' + (status.message || '');
  document.getElementById('statusMessage').textContent = (status.stage_label || status.stage || '');

  if (status.status === 'running') {
    setTimeout(pollStatus, 1500);
  } else {
    document.getElementById('runBtn').disabled = false;
    if (status.status === 'done') loadResults();
    else if (status.status === 'failed') {
      showToast('管线执行失败: ' + (status.message || '未知错误'), 'error');
    }
  }
}

async function loadResults() {
  var section = document.getElementById('resultsSection');
  section.style.display = 'flex';
  section.textContent = '';

  // Load project info and each stage output
  for (var i = 0; i < selectedStages.length; i++) {
    var stage = selectedStages[i];
    try {
      var out = await fetch('/api/output/' + taskId + '/' + stage);
      if (out.ok) {
        var data = await out.json();
        renderStageResult(section, stage, data);
      }
    } catch(e) {}
  }

  // Load narrative
  try {
    var narResp = await fetch('/api/output/' + taskId + '/research/narrative');
    if (narResp.ok) {
      var narData = await narResp.json();
      renderNarrative(section, narData.narrative);
    }
  } catch(e) {}
}

function renderStageResult(section, stage, data) {
  var card = document.createElement('div');
  card.className = 'result-card';

  var header = document.createElement('div');
  header.className = 'result-header';

  var h3 = document.createElement('h3');
  h3.textContent = (STAGE_EMOJI[stage] || '') + ' ' + (STAGE_NAMES[stage] || stage);
  header.appendChild(h3);

  header.addEventListener('click', function() {
    var body = this.nextElementSibling;
    body.classList.toggle('open');
  });

  var body = document.createElement('div');
  body.className = 'result-body';

  if (stage === 'video' && data.shots) {
    body.appendChild(renderStoryboard(data));
  } else if (stage === 'lyrics') {
    body.appendChild(renderLyricsBody(data));
  } else {
    var pre = document.createElement('pre');
    pre.textContent = JSON.stringify(data, null, 2);
    body.appendChild(pre);
  }

  card.appendChild(header);
  card.appendChild(body);
  section.appendChild(card);
}

function renderStoryboard(data) {
  var frag = document.createDocumentFragment();

  var info = document.createElement('p');
  info.style.marginBottom = '16px';
  info.textContent = '视觉主题: ' + (data.visual_theme || '') + '  色彩弧线: ' + (data.color_arc || '');
  frag.appendChild(info);

  var table = document.createElement('table');
  table.className = 'storyboard-table';

  var thead = document.createElement('thead');
  var tr = document.createElement('tr');
  ['镜号','时长','景别','运镜','画面','情绪','歌词'].forEach(function(h) {
    var th = document.createElement('th');
    th.textContent = h;
    tr.appendChild(th);
  });
  thead.appendChild(tr);
  table.appendChild(thead);

  var tbody = document.createElement('tbody');
  (data.shots || []).forEach(function(s) {
    var row = document.createElement('tr');
    [
      s.shot_id || '',
      (s.duration_sec || '') + 's',
      s.shot_type || '',
      s.camera_movement || '',
      (s.visual_description || '').slice(0, 60),
      s.emotion || '',
      (s.lyrics_line || '').slice(0, 30)
    ].forEach(function(v) {
      var td = document.createElement('td');
      td.textContent = v;
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  frag.appendChild(table);

  return frag;
}

function renderLyricsBody(data) {
  var frag = document.createDocumentFragment();

  (data.sections || []).forEach(function(sec) {
    var div = document.createElement('div');
    div.className = 'lyrics-section';

    var label = document.createElement('div');
    label.className = 'lyrics-label';
    label.textContent = '[' + sec.section_type + '] ' + (sec.emotion || '');
    div.appendChild(label);

    (sec.lines || []).forEach(function(line) {
      var p = document.createElement('div');
      p.className = 'lyrics-line';
      p.textContent = line;
      div.appendChild(p);
    });

    frag.appendChild(div);
  });

  return frag;
}

function renderNarrative(section, narrative) {
  var card = document.createElement('div');
  card.className = 'result-card';

  var header = document.createElement('div');
  header.className = 'result-header';
  var h3 = document.createElement('h3');
  h3.textContent = '📖 角色生平叙事';
  header.appendChild(h3);

  header.addEventListener('click', function() {
    var body = this.nextElementSibling;
    body.classList.toggle('open');
  });

  var body = document.createElement('div');
  body.className = 'result-body';

  var textDiv = document.createElement('div');
  textDiv.className = 'story-text';

  narrative.split('\n').forEach(function(para) {
    var p = document.createElement('p');
    p.textContent = para;
    p.style.marginBottom = '12px';
    textDiv.appendChild(p);
  });

  body.appendChild(textDiv);
  card.appendChild(header);
  card.appendChild(body);
  section.appendChild(card);
}

// Init
buildStageChips();
</script>
</body>
</html>
